services:
  db:
    image: postgres:16-alpine
    container_name: harcon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-harcon_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harcon_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-harcon_precision}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-harcon_admin} -d ${POSTGRES_DB:-harcon_precision}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: harcon_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-harcon_admin}:${POSTGRES_PASSWORD:-harcon_secure_pass}@db:5432/${POSTGRES_DB:-harcon_precision}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-min-32-chars-harcon}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: harcon_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_API_URL: http://backend:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
