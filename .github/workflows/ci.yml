name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    name: Lint, Test & Build Next.js
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Static Type Check
        run: npx tsc --noEmit

      - name: Execute Tests
        run: npm test

      - name: Build Next.js Application
        env:
          MONGODB_URI: mongodb://localhost:27017/harcon_precision
          JWT_SECRET: harcon-precision-super-secure-jwt-secret-key-32-chars-min!
        run: npm run build
