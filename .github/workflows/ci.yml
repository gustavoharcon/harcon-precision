name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: harcon_admin
          POSTGRES_PASSWORD: harcon_secure_pass
          POSTGRES_DB: harcon_precision
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Push Database Schema
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://harcon_admin:harcon_secure_pass@localhost:5432/harcon_precision?schema=public
        run: npx prisma db push

      - name: TypeScript Static Analysis
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Execute Backend Tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://harcon_admin:harcon_secure_pass@localhost:5432/harcon_precision?schema=public
          JWT_SECRET: harcon-precision-super-secure-jwt-secret-key-32-chars-min!
        run: npm test

  frontend-ci:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend Build (SSR + Client)
        working-directory: ./frontend
        run: npm run build

      - name: Execute Frontend Tests
        working-directory: ./frontend
        run: npm test
